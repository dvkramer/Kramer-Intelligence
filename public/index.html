<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kramer Intelligence (Gen 3)</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

    <script type="module" src="js/app.js"></script>
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <h2>
            Chats
            <button id="new-chat-btn" title="New Chat">+</button>
        </h2>
        <div id="chat-list-items">
            <!-- Chat items injected here -->
        </div>
        <div id="user-area">
            <span id="user-info" class="hidden"></span>
            <button id="login-btn" class="auth-btn">Login</button>
            <button id="logout-btn" class="auth-btn hidden">Logout</button>
        </div>
    </div>

    <!-- Main Area -->
    <div id="main">
        <header>
            <h1>Kramer Intelligence</h1>
            <div>
                <button id="share-chat-btn" class="hidden">Share</button>
                <button id="save-chat-btn">Save Chat</button>
            </div>
        </header>

        <div id="chat-messages">
            <!-- Messages injected here -->
             <div class="message ai">
                 Hello! I am Kramer Intelligence, powered by Gemini 3. How can I help you today?
             </div>
        </div>

        <div id="input-area">
            <div id="file-preview" class="hidden">
                <img id="file-preview-img" src="" alt="Preview">
                <span id="file-preview-name"></span>
                <button id="remove-file-btn">×</button>
            </div>
            <div id="input-wrapper">
                <input type="file" id="file-input" hidden accept="image/*,application/pdf">
                <button id="attach-btn" title="Attach File">📎</button>
                <textarea id="chat-input" rows="1" placeholder="Type a message..."></textarea>
                <button id="send-btn" title="Send">➤</button>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <h2 id="auth-title">Login</h2>
            <form id="auth-form">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" id="auth-submit">Login</button>
            </form>
            <span id="toggle-auth">Need an account? Sign up</span>
        </div>
    </div>

</body>
</html>
